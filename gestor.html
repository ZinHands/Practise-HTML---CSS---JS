<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://universidadeuropea.com/resources/media/images/tipos-videojuegos-800x450.original.webp">
    <link rel="stylesheet" href="gestor.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Gestor jugadores online</title>
</head>
<body>
    <div id="container">
        <h1 class="title">Gestor de jugadores online</h1>
        <div id="containerForm">
            <form>
                <p>*Todos los campos son <b>obligatorios</b></p>
                <div id="formInput">
                    <div class="name">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="life">
                         <label for="life">Vidas</label>
                        <input type="number" id="life" min="1" max="10" required>
                    </div>
                    <div class="points">
                        <label for="points">Puntos</label>
                        <input type="number" id="points" min="1" max="100" required>
                    </div>
                </div>
                <button type="submit">Agregar</button>
            </form>
        </div>
        <div id="info">
            <div id="infoPerson"></div>
        </div>
    </div>
    <script src="gestor.js"></script>
</body>
</html>
    <script src="gestor.js"></script>
</body>
</html>
