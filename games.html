<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="games.css">
    <title>Supermercado ALAIN</title>
</head>
<body>
    <div id="container">
        <h1 class="containerTitle">Supermercado ALAIN</h1>
        <div id="register">
            <h2 class="registerTitle">Ingresá el producto, cantidad y precio al inventario</h2>
            <form id="registerForm">
                <div id="input1">
                    <label for="product">Producto</label>
                    <input type="text" id="product" required>
                </div>
                <div id="input2">
                    <label for="amount">Cantidad</label>
                    <input type="number" id="amount" min="1" required>
                </div>
                <div id="input3">
                    <label for="price">Precio</label>
                    <input type="number" id="price" min="1" required>
                </div>
                <button type="submit">Guardar</button>
            </form>
        </div>
        <div id="buy">
            <h2 class="buyTitle">Carrito</h2>
            <form id="buyForm">
                <label for="buyProducts">Seleccioná lo que querés comprar</label>
                <input type="text" id="buyProducts" required>
                <button type="submit">Agregar</button>
            </form>
        </div>
        <div id="result">
            
        </div>
    </div>
    <script src="games.js"></script>
</body>
</html>
